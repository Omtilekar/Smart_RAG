[pytest]
testpaths = tests
markers =
    local_data: requires this project's frozen local datasets (data/)
    gpu: requires a CUDA-capable GPU
    model: requires an embedding model already present in the local Hugging Face cache (no network download)
    generation_api: requires a live OpenRouter API key and an explicitly configured GENERATION_MODEL (real network call)
    ollama: requires a locally running Ollama server (http://localhost:11434) with the judge model installed
